<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro Solano · Territorios</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#182231;--muted:#667085;--line:#e3e7eb;--blue:#1264d6;--done:#25a96a}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink)}.app{height:100%;display:grid;grid-template-rows:72px 1fr}.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-weight:850;letter-spacing:.055em}.sub{font-size:12px;color:var(--muted);margin-top:3px}.menu{border:1px solid var(--line);background:#fff;border-radius:12px;width:42px;height:42px;font-size:20px}.body{min-height:0;display:grid;grid-template-columns:310px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:18px;overflow:auto}h2{margin:0 0 5px}.hint{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:14px}.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.list{margin-top:12px}.item{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 11px;margin:5px 0;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;text-align:left}.item.active{border-color:var(--blue);background:#eef6ff}.count{font-size:11px;color:var(--muted)}.map{position:relative;min-width:0}.mapbox{height:100%;width:100%}.card{position:absolute;z-index:700;right:18px;top:18px;width:320px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 10px 30px #0002;padding:15px}.card h3{margin:0 0 4px}.card p{margin:4px 0 12px;color:var(--muted);font-size:12px}.badge{background:#182231;color:#fff;border-radius:8px;padding:4px 7px;font-size:11px;font-weight:800}.note{background:#fff7e6;border:1px solid #f0d49a;border-radius:10px;padding:10px;margin-top:12px;color:#795b18;font-size:12px;line-height:1.4}.progress{display:grid;gap:7px;margin-top:12px}.block{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}.block:hover{border-color:#9bbef0}.dot{width:14px;height:14px;border-radius:4px;background:#d8c5e8;border:1px solid #b69ad0}.dot.done{background:var(--done);border-color:#168052}.toolbar{position:absolute;z-index:650;left:18px;top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #0002;padding:8px 10px;font-size:12px}.toolbar b{display:block;margin-bottom:3px}.territory-label{font-weight:800;color:#182231}.block-label{font-weight:800;font-size:14px}.leaflet-tooltip{font-weight:700}.osm-road{color:#1264d6}@media(max-width:800px){.body{grid-template-columns:1fr}.side{position:absolute;z-index:900;left:10px;top:82px;width:285px;border:1px solid var(--line);border-radius:15px;display:none;box-shadow:0 12px 30px #0002}.side.open{display:block}.card{left:18px;right:auto;top:18px}.toolbar{left:18px;top:145px}}
</style>
</head>
<body><div class="app"><header class="top"><div><div class="brand">CENTRO SOLANO TERRITORIOS</div><div class="sub">Mapa real + sectorización territorial</div></div><button class="menu" id="menu">☰</button></header><div class="body"><aside class="side" id="side"><h2>Territorios</h2><div class="hint">Seleccioná un territorio. T1 y T2 están preparados para la primera digitalización y validación sobre OSM.</div><input class="search" id="search" placeholder="Buscar territorio..."><div class="list" id="list"></div></aside><main class="map"><div id="map" class="mapbox"></div><div class="toolbar"><b>Base de trabajo</b><span>OSM + calles reales · sector en revisión</span></div><div class="card" id="card"></div></main></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{preferCanvas:true}).setView([-34.78035,-58.30610],17);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let selected=1;
const status=JSON.parse(localStorage.getItem('cst-status')||'{}');
const data={1:['1A','1B','1C','1D','1E'],2:['2A','2B','2C','2D','2E','2F']};
const focus=L.rectangle([[-34.7819,-58.3084],[-34.7787,-58.3036]],{color:'#1264d6',weight:2,dashArray:'7 7',fill:false,interactive:false}).addTo(map);
function blockCard(n){const blocks=data[n]||[];const completed=blocks.filter(x=>status[x]).length;document.getElementById('card').innerHTML=`<h3>Territorio ${n}</h3><p>${blocks.length?`Sectorización inicial: ${completed} de ${blocks.length} manzanas completadas.`:'Pendiente de digitalización'}</p><span class="badge">OpenStreetMap conectado</span>${blocks.length?`<div class="note"><b>Regla:</b> las letras se asignan arriba → abajo y, dentro de cada nivel, izquierda → derecha. Las formas definitivas seguirán las calles reales.</div><div class="progress">${blocks.map(x=>`<button class="block" onclick="toggle('${x}')"><span class="block-label">${x}</span><span class="dot ${status[x]?'done':''}"></span></button>`).join('')}</div>`:`<div class="note"><b>Próximo:</b> digitalizar este territorio sobre las manzanas reales de OSM.</div>`}`}
function toggle(x){status[x]=!status[x];localStorage.setItem('cst-status',JSON.stringify(status));blockCard(selected);renderList(document.getElementById('search').value.trim())}
function select(n){selected=n;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',+x.dataset.n===n));blockCard(n);map.setView(n<=2?[-34.78035,-58.30610]:map.getCenter(),n<=2?17:map.getZoom())}
function renderList(filter=''){const el=document.getElementById('list');el.innerHTML='';for(let n=1;n<=67;n++){if(filter&&!String(n).includes(filter))continue;const count=data[n]?.length;const done=count?data[n].filter(x=>status[x]).length:0;const b=document.createElement('button');b.className='item';b.dataset.n=n;b.innerHTML=`<span><b>Territorio ${n}</b><br><span class="count">${count?`${done} de ${count} manzanas completadas`:'pendiente de digitalización'}</span></span><span>›</span>`;b.onclick=()=>select(n);el.appendChild(b)}}
renderList();select(1);document.getElementById('search').oninput=e=>renderList(e.target.value.trim());document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');
</script></body></html>
