<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro Solano · Territorios</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#182231;--muted:#667085;--line:#e3e7eb;--blue:#1264d6;--done:#25a96a;--territory:#f3b72b}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink)}.app{height:100%;display:grid;grid-template-rows:72px 1fr}.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-weight:850;letter-spacing:.055em}.sub{font-size:12px;color:var(--muted);margin-top:3px}.menu,.panel-close{border:1px solid var(--line);background:#fff;border-radius:12px;width:42px;height:42px;font-size:20px;cursor:pointer}.body{min-height:0;display:grid;grid-template-columns:310px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:18px;overflow:auto}.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}h2{margin:0}.hint{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:14px}.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.list{margin-top:12px}.item{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 11px;margin:5px 0;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;text-align:left}.item.active{border-color:var(--blue);background:#eef6ff}.count{font-size:11px;color:var(--muted)}.map{position:relative;min-width:0}.mapbox{height:100%;width:100%}.card{position:absolute;z-index:700;right:18px;top:18px;width:330px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 10px 30px #0002;padding:15px}.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.card h3{margin:0 0 4px}.card p{margin:4px 0 12px;color:var(--muted);font-size:12px}.badge{background:#182231;color:#fff;border-radius:8px;padding:4px 7px;font-size:11px;font-weight:800;display:inline-block}.note{background:#fff7e6;border:1px solid #f0d49a;border-radius:10px;padding:10px;margin-top:12px;color:#795b18;font-size:12px;line-height:1.4}.progress{display:grid;gap:7px;margin-top:12px}.block{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}.block:hover{border-color:#9bbef0}.dot{width:14px;height:14px;border-radius:4px;background:#d8c5e8;border:1px solid #b69ad0}.dot.done{background:var(--done);border-color:#168052}.toolbar{position:absolute;z-index:650;left:18px;top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #0002;padding:10px 12px;font-size:12px}.toolbar b{display:block;margin-bottom:3px}.toolbar button{margin-top:8px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer;font-weight:700}.leaflet-tooltip{font-weight:800}.osm-block{fill:#1264d6;fill-opacity:.08;stroke:#1264d6;stroke-opacity:.55;stroke-width:2}.osm-building{fill:#667085;fill-opacity:.035;stroke:#667085;stroke-opacity:.28;stroke-width:1}.leaflet-container{background:#e9e6df}@media(max-width:800px){.body{grid-template-columns:1fr}.side{position:absolute;z-index:900;left:10px;top:82px;width:285px;border:1px solid var(--line);border-radius:15px;display:none;box-shadow:0 12px 30px #0002}.side.open{display:block}.card{left:18px;right:18px;top:18px;width:auto;max-width:430px}.toolbar{left:18px;top:auto;bottom:18px}.panel-close{width:34px;height:34px;border-radius:9px;font-size:17px}}
</style>
</head>
<body><div class="app"><header class="top"><div><div class="brand">CENTRO SOLANO TERRITORIOS</div><div class="sub">Mapa real + sectorización territorial</div></div><button class="menu" id="menu" aria-label="Abrir territorios">☰</button></header><div class="body"><aside class="side" id="side"><div class="side-head"><h2>Territorios</h2><button class="panel-close" id="sideClose" aria-label="Ocultar panel">×</button></div><div class="hint">Seleccioná un territorio. T1 y T2 están preparados para la primera digitalización y validación sobre OSM.</div><input class="search" id="search" placeholder="Buscar territorio..."><div class="list" id="list"></div></aside><main class="map"><div id="map" class="mapbox"></div><div class="toolbar"><b>Base de digitalización</b><span>OSM + calles reales + manzanas detectadas</span><br><button id="toggleBlocks">Ocultar manzanas OSM</button></div><div class="card" id="card"></div></main></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script>
const HOME=[-34.7855682,-58.3000984];
const map=L.map('map',{preferCanvas:true}).setView(HOME,17);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let selected=1; const status=JSON.parse(localStorage.getItem('cst-status')||'{}');
const data={1:['1A','1B','1C','1D','1E'],2:['2A','2B','2C','2D','2E','2F']};
const osmBlocks=L.layerGroup().addTo(map), osmBuildings=L.layerGroup().addTo(map); let blocksVisible=true;
async function loadOSM(){
 const q='[out:json][timeout:35];(way[highway](-34.7885,-58.3045,-34.7820,-58.2960);way[building](-34.7885,-58.3045,-34.7820,-58.2960););out geom;';
 try{const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));if(!r.ok)throw new Error('Overpass');const j=await r.json();
  const roads=[]; j.elements.forEach(w=>{if(!w.geometry)return;const pts=w.geometry.map(p=>[p.lat,p.lon]);if(w.tags&&w.tags.highway){roads.push(turf.lineString(w.geometry.map(p=>[p.lon,p.lat])))}else{L.polygon(pts,{className:'osm-building',interactive:false}).addTo(osmBuildings)}});
  if(roads.length){const fc=turf.featureCollection(roads);let polys=[];try{polys=turf.polygonize(fc).features}catch(e){polys=[]}polys.filter(p=>turf.area(p)>500&&turf.area(p)<120000).forEach((p,i)=>{const ring=p.geometry.coordinates[0].map(c=>[c[1],c[0]]);const layer=L.polygon(ring,{className:'osm-block',interactive:true}).bindTooltip('Manzana OSM '+(i+1),{sticky:true});layer.addTo(osmBlocks)});}
 }catch(e){console.warn('No se pudo construir la capa de manzanas OSM',e)}
}
loadOSM();
function blockCard(n){const blocks=data[n]||[];const completed=blocks.filter(x=>status[x]).length;document.getElementById('card').innerHTML=`<div class="card-head"><div><h3>Territorio ${n}</h3><p>${blocks.length?`Sectorización: ${completed} de ${blocks.length} manzanas completadas.`:'Pendiente de digitalización'}</p></div><button class="panel-close" onclick="hideCard()" aria-label="Ocultar panel">×</button></div><span class="badge">OpenStreetMap conectado</span>${blocks.length?`<div class="note"><b>Digitalización en curso.</b> Las manzanas azules del mapa son las geometrías detectadas desde las calles de OSM. La asignación definitiva de T${n} se valida contra el plano original antes de fijarla.</div><div class="progress">${blocks.map(x=>`<button class="block" onclick="toggle('${x}')"><span class="block-label">${x}</span><span class="dot ${status[x]?'done':''}"></span></button>`).join('')}</div>`:`<div class="note"><b>Próximo:</b> digitalizar este territorio sobre las manzanas reales de OSM.</div>`}`}
function hideCard(){document.getElementById('card').style.display='none'}
function showCard(){document.getElementById('card').style.display='block'}
function toggle(x){status[x]=!status[x];localStorage.setItem('cst-status',JSON.stringify(status));blockCard(selected);renderList(document.getElementById('search').value.trim())}
function select(n){selected=n;showCard();document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',+x.dataset.n===n));blockCard(n);if(n<=2)map.setView(HOME,18)}
function renderList(filter=''){const el=document.getElementById('list');el.innerHTML='';for(let n=1;n<=67;n++){if(filter&&!String(n).includes(filter))continue;const count=data[n]?.length;const done=count?data[n].filter(x=>status[x]).length:0;const b=document.createElement('button');b.className='item';b.dataset.n=n;b.innerHTML=`<span><b>Territorio ${n}</b><br><span class="count">${count?`${done} de ${count} manzanas completadas`:'pendiente de digitalización'}</span></span><span>›</span>`;b.onclick=()=>{select(n);if(innerWidth<=800)document.getElementById('side').classList.remove('open')};el.appendChild(b)}}
renderList();select(1);document.getElementById('search').oninput=e=>renderList(e.target.value.trim());document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');document.getElementById('sideClose').onclick=()=>document.getElementById('side').classList.remove('open');document.getElementById('toggleBlocks').onclick=()=>{blocksVisible=!blocksVisible;if(blocksVisible)osmBlocks.addTo(map);else osmBlocks.remove();document.getElementById('toggleBlocks').textContent=blocksVisible?'Ocultar manzanas OSM':'Mostrar manzanas OSM'};
</script></body></html>
